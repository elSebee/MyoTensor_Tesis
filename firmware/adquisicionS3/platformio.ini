; ============================================================
;  MyoTensor — PlatformIO Config
;  Board: Seeed Studio XIAO ESP32-S3
; ============================================================
;  Entornos:
;    pio run -e inferencia   → firmware de inferencia + servos
;    pio run -e dataset      → firmware de recoleccion de datos
; ============================================================

; ── Base comun ────────────────────────────────────────────────
[env]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

board_build.arduino.memory_type = qio_opi

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

upload_speed    = 921600
monitor_speed   = 921600
monitor_filters = send_on_enter, colorize

; ── Modo Inferencia (default — el firmware original) ─────────
[env:inferencia]
; Hereda todo de [env]
; lib_deps =
;     adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1

; ── Modo Dataset (recoleccion de datos para entrenamiento) ───
[env:dataset]
build_flags =
    ${env.build_flags}
    -D DATASET_MODE
