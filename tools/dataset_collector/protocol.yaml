# ============================================================
#  protocol.yaml — Configuracion del protocolo de adquisicion
# ============================================================
#  Modificar estos valores para ajustar el protocolo sin tocar
#  el codigo fuente. El script main.py lee este archivo al inicio.
# ============================================================

protocol:
  n_sets: 2                 # numero de bloques (Sets) de la sesion
  gesture_duration_s: 5.0    # segundos de contraccion activa
  rest_duration_s: 3.0       # segundos de reposo entre gestos
  post_mvc_duration_s: 2.0   # pausa entre MVC y el primer set

calibration:
  noise_duration_s: 5.0      # segundos de reposo absoluto (ruido basal)
  mvc_duration_s: 3.0        # segundos de contraccion voluntaria maxima (MVC)

onset:
  rms_window_ms: 100         # ventana de RMS para detectar onset (ms)
  threshold_factor: 3.0      # N x std_noise para considerar gesto activo
  min_active_ms: 200         # duracion minima valida de un gesto (ms)

# Gestos en orden base (se aleatorizan si randomize_gestures = true)
# id: etiqueta numerica en el CSV (0 = reposo, se genera automaticamente)
gestures:
  - id: 1
    name: palma
    label: "ABRE LA MANO"
    image: palma.gif

  - id: 2
    name: puno
    label: "CIERRA EL PUÑO"
    image: puno.gif

  - id: 3
    name: paz
    label: "HAZ PAZ"
    image: paz.gif

network:
  port: 5005

output:
  base_dir: "../../intelligence/datasets/raw/myotensor_proto"
